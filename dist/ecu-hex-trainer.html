<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭБУ hex-тренажёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #fbfbf8; --panel: #f1f0ea; --line: #d9d7cd; --fg: #1d1d1b; --muted: #6d6b63;
  --accent: #2f5fb3; --accent-fg: #fff;
  --obj: #b35a00; --axis: #9a6d00; --cnt: #7a6a4a; --str: #7b3fb0; --ref: #00838f; --zero: #b7b4a8;
  --sel-bg: #b9d2ff;
  --hex-obj: #fde0c2; --hex-axis: #fbefc0; --hex-cnt: #ece2cc; --hex-str: #ece0f7;
  --ok: #1d7a3a; --warn: #b26b00; --bad: #b3261e;
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1f; --panel: #232428; --line: #383a40; --fg: #e3e3df; --muted: #9a9a94;
    --accent: #6d9cf0; --accent-fg: #0d1526;
    --obj: #ffad5c; --axis: #e6c15a; --cnt: #c7b48c; --str: #c69cf0; --ref: #5cc9d3; --zero: #5d5d58;
    --sel-bg: #2b4a80;
    --hex-obj: #4a321a; --hex-axis: #423818; --hex-cnt: #36302a; --hex-str: #33264a;
    --ok: #63c27f; --warn: #e3a64a; --bad: #ef7a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1f; --panel: #232428; --line: #383a40; --fg: #e3e3df; --muted: #9a9a94;
  --accent: #6d9cf0; --accent-fg: #0d1526;
  --obj: #ffad5c; --axis: #e6c15a; --cnt: #c7b48c; --str: #c69cf0; --ref: #5cc9d3; --zero: #5d5d58;
  --sel-bg: #2b4a80;
  --hex-obj: #4a321a; --hex-axis: #423818; --hex-cnt: #36302a; --hex-str: #33264a;
  --ok: #63c27f; --warn: #e3a64a; --bad: #ef7a72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }

/* шапка */
#top { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#top .brand { font-weight: 600; margin-right: 8px; }
#top .sp { flex: 1; }
.menu { position: relative; }
.menu > .items { display: none; position: absolute; top: 100%; left: 0; z-index: 50; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px; min-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.menu.open > .items { display: block; }
.menu .items button { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; }
.menu .items button:hover { background: var(--sel-bg); }
.menu .items hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* раскладка */
#main { flex: 1; display: flex; min-height: 0; }
#side { width: 320px; min-width: 240px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }
#center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--line); }
.tabs button { border-radius: 4px 4px 0 0; border-bottom: 0; background: none; }
.tabs button.on { background: var(--bg); border-color: var(--line); font-weight: 600; }
#sidebody { flex: 1; overflow: auto; padding: 8px; background: var(--bg); }
#viewwrap { flex: 1; display: flex; min-height: 0; }
#hexcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#view { flex: 1; overflow-x: auto; overflow-y: hidden; font: 13px/18px var(--mono); white-space: pre; outline: none; cursor: default; user-select: none; }
#view canvas.v2d { display: block; cursor: crosshair; }
#viewbar { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#viewbar input[type=number] { padding: 2px 4px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
#vscroll { width: 14px; border-left: 1px solid var(--line); position: relative; background: var(--panel); cursor: pointer; }
#vthumb { position: absolute; left: 2px; right: 2px; background: var(--muted); opacity: .45; border-radius: 4px; min-height: 18px; }
#split { height: 5px; cursor: row-resize; background: var(--line); }
#bottom { height: 270px; display: flex; flex-direction: column; background: var(--bg); }
#bottombar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#bottombody { flex: 1; overflow: auto; padding: 6px 8px; }
#status { display: flex; gap: 14px; padding: 3px 10px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
#status b { color: var(--fg); font-weight: 600; }

/* hex */
#hexhead { font: 13px/18px var(--mono); white-space: pre; padding-left: 6px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel); user-select: none; }
.hx, #hexhead { padding-left: 6px; }
.hx { height: 18px; }
.hx .a, #hexhead .a { color: var(--muted); display: inline-block; width: 10ch; }
#hexhead .a { cursor: pointer; }
.hx span.y, #hexhead span.y { display: inline-block; width: calc(var(--cw, 2ch) + 1ch); text-align: var(--ca, center); padding-right: .3ch; }
.hx span.y.g8, #hexhead span.y.g8 { margin-right: 1ch; }
.hx span.y.z { color: var(--zero); }
.hx .t { margin-left: 2ch; color: var(--muted); }
.hx .t span.on { color: var(--fg); }
.k-obj { background: var(--hex-obj); } .k-axis { background: var(--hex-axis); }
.k-cnt { background: var(--hex-cnt); } .k-str { background: var(--hex-str); }
.r-data { box-shadow: inset 0 -2px 0 var(--ref); } .r-axis { box-shadow: inset 0 -2px 0 var(--axis); }
.r-cnt { box-shadow: inset 0 -2px 0 var(--cnt); } .r-str { box-shadow: inset 0 -2px 0 var(--str); }
.hx .cur { outline: 2px solid var(--accent); outline-offset: -2px; }
.hx .sel { background: var(--sel-bg) !important; }

/* инспектор */
#insp { width: 260px; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 6px 8px; font-size: 12px; }
#insp table { border-collapse: collapse; width: 100%; font: 12px/1.55 var(--mono); }
#insp td { padding: 0 4px; white-space: nowrap; }
#insp td:first-child { color: var(--muted); font-family: var(--ui); }
#insp h4 { margin: 8px 0 3px; font-size: 12px; }
.objbox { border-left: 3px solid var(--obj); padding: 3px 7px; margin: 4px 0; background: var(--bg); border-radius: 0 4px 4px 0; }
.objbox.ref { border-left-color: var(--ref); }
.objbox b { font-family: var(--mono); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 10px; margin-right: 3px; vertical-align: -1px; border-radius: 2px; }

/* боковая панель */
.list { display: flex; flex-direction: column; gap: 1px; }
.item { padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.item:hover { background: var(--sel-bg); }
.item.on { background: var(--sel-bg); }
.item .addr { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.item .nm { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .kd { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.sec { margin: 10px 0 4px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
.badge { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; border: 1px solid currentColor; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.score { font-size: 28px; font-weight: 700; }
table.chk { border-collapse: collapse; width: 100%; font-size: 12px; }
table.chk td { padding: 3px 5px; border-top: 1px solid var(--line); vertical-align: top; }
table.chk td.mono { font-family: var(--mono); }
.hint { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 10px 4px; }

/* таблица карты */
table.map { border-collapse: collapse; font: 12px/1.3 var(--mono); }
table.map td, table.map th { padding: 1px 5px; text-align: right; border: 1px solid var(--line); white-space: nowrap; }
table.map th { background: var(--panel); color: var(--axis); font-weight: 600; }
table.map th.corner { color: var(--muted); font-weight: 400; }
canvas.plot { display: block; max-width: 100%; }

/* диалоги */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 100; align-items: flex-start; justify-content: center; padding-top: 5vh; }
#veil.on { display: flex; }
.dlg { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.3); min-width: 380px; max-width: min(1100px, 96vw); max-height: 90vh; display: flex; flex-direction: column; }
.dlg h3 { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
.dlg .body { padding: 10px 14px; overflow: auto; }
.dlg .btns { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center; }
.form > label { color: var(--muted); }
fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; padding: 6px 10px; }
legend { color: var(--muted); padding: 0 4px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
table.keys td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
#toast { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; display: none; z-index: 200; max-width: 80vw; }
#drop { position: fixed; inset: 0; border: 4px dashed var(--accent); display: none; z-index: 150; pointer-events: none; }
#welcome { padding: 30px; max-width: 760px; font: 14px/1.6 var(--ui); white-space: normal; user-select: text; }
#welcome h2 { margin-top: 0; }
#welcome li { margin: 4px 0; }

@media (max-width: 760px) {
  #main { flex-direction: column; }
  #side { width: auto; height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #insp { display: none; }
  #bottom { height: 200px; }
  .dlg { min-width: 0; width: 96vw; }
  .form { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="top">
  <span class="brand">ЭБУ hex-тренажёр</span>
  <button id="bOpenFw" title="Открыть файл прошивки (.bin) — можно перетащить в окно. Ctrl+O">Прошивка…</button>
  <button id="bOpenRef" title="Эталон: DAMOS (.dam) или A2L. Его карты подчёркнуты в hex, с ним идёт сверка">Эталон DAMOS / A2L…</button>
  <div class="menu" id="mPack"><button>Мой маппак ▾</button>
    <div class="items">
      <button data-act="newObject">Новый объект у курсора… <span class="muted">K</span></button>
      <hr>
      <button data-act="saveA2l">Сохранить как A2L… <span class="muted">Ctrl+S</span></button>
      <button data-act="saveDamos">Сохранить как DAMOS (.dam)… <span class="muted">Ctrl+Shift+S</span></button>
      <button data-act="openPack">Открыть маппак (.a2l / .dam)…</button>
      <hr>
      <button data-act="clearPack">Очистить маппак…</button>
    </div>
  </div>
  <label class="muted" title="Адрес первого байта файла — как Base Address при загрузке в Ghidra и как адреса в DAMOS/A2L">база <input id="baseIn" class="mono" style="width:100px" value="0x0"></label>
  <span class="sp"></span>
  <button id="bTheme" title="Светлая/тёмная тема">Тема</button>
  <button id="bHelp" title="Горячие клавиши (F1)">Клавиши</button>
</div>
<div id="main">
  <div id="side">
    <div class="tabs" id="sidetabs">
      <button data-tab="pack" class="on">Мой маппак</button>
      <button data-tab="ref">Эталон</button>
      <button data-tab="check">Сверка</button>
    </div>
    <div id="sidebody"></div>
  </div>
  <div id="center">
    <div id="viewwrap">
      <div id="hexcol">
        <div id="viewbar"></div>
        <div id="hexhead"></div>
        <div id="view" tabindex="0"></div>
      </div>
      <div id="vscroll"><div id="vthumb"></div></div>
      <div id="insp"></div>
    </div>
    <div id="split" title="Потяните, чтобы изменить высоту"></div>
    <div id="bottom">
      <div id="bottombar"></div>
      <div id="bottombody"></div>
    </div>
  </div>
</div>
<div id="status"></div>
<div id="veil"></div>
<div id="toast"></div>
<div id="drop"></div>
<input type="file" id="fileIn" hidden>

<script>
// ---- model.js
// Общая модель калибровочного объекта: и ваш маппак, и DAMOS/A2L
// приводятся к одному виду, иначе их нельзя честно сравнить.
//
// Объект (все адреса -- адреса CPU, как в Ghidra и в DAMOS):
//   name, desc
//   kind    value | curve | map | axis | block | string
//   addr    начало записи (для раскладки Bosch -- первый счётчик)
//   layout  plain -- по адресу сразу данные
//           bosch -- перед данными счётчики и оси (порядок -- header)
//   header  порядок элементов заголовка: nR nC aR aC (по умолчанию так,
//           как лежит у Bosch: счётчик строк, счётчик столбцов, ось строк,
//           ось столбцов); для кривой и оси -- nC aC
//   countSize  ширина счётчика, 1 или 2 байта
//   cols    число точек по БЫСТРОМУ индексу -- соседние ячейки в памяти
//   rows    число точек по медленному индексу
//   cell    u8 s8 u16 s16 u32 s32 f32
//   be      true -- старший байт первым (по умолчанию little-endian, как C166)
//   factor, offset, unit -- физ = сырое * factor + offset
//   axisC, axisR -- оси столбцов и строк:
//           {mode: none | inline | ref, ref: адрес записи оси, cell, factor, offset, unit}
//
// "Столбцы" и "строки" здесь -- про память, а не про подписи X/Y: у Bosch
// ось X в DAMOS -- это строки (медленный индекс), а в A2L всё зависит от
// ROW_DIR/COLUMN_DIR. Сравнивать по X/Y значило бы сравнивать соглашения.
(function (root) {
  "use strict";
  const ET = root.ET = root.ET || {};

  const CELLS = {
    u8: { size: 1, signed: false }, s8: { size: 1, signed: true },
    u16: { size: 2, signed: false }, s16: { size: 2, signed: true },
    u32: { size: 4, signed: false }, s32: { size: 4, signed: true },
    f32: { size: 4, signed: true, float: true },
  };

  const KINDS = {
    value: "значение", curve: "кривая", map: "карта", axis: "ось",
    block: "блок значений", string: "строка",
  };

  function cellOf(name) { return CELLS[name] || CELLS.u8; }

  function readCell(data, off, cell, be) {
    const c = cellOf(cell);
    if (off < 0 || off + c.size > data.length) return NaN;
    if (c.float) {
      const dv = new DataView(data.buffer, data.byteOffset + off, 4);
      return dv.getFloat32(0, !be);
    }
    let v = 0;
    if (be) for (let i = 0; i < c.size; i++) v = v * 256 + data[off + i];
    else for (let i = c.size - 1; i >= 0; i--) v = v * 256 + data[off + i];
    if (c.signed) {
      const lim = Math.pow(2, 8 * c.size - 1);
      if (v >= lim) v -= 2 * lim;
    }
    return v;
  }

  function defaultHeader(kind) {
    return kind === "map" ? ["nR", "nC", "aR", "aC"] : ["nC", "aC"];
  }

  function axisDefaults() {
    return { mode: "none", ref: null, cell: "u8", factor: 1, offset: 0, unit: "" };
  }

  // Заполнить пропущенные поля -- объект из любого источника становится полным
  function normalize(o) {
    const n = Object.assign({
      name: "", desc: "", kind: "value", addr: 0, layout: "plain", header: null,
      countSize: 1, cols: 1, rows: 1, cell: "u8", be: false,
      factor: 1, offset: 0, unit: "", length: 0, comment: "",
    }, o);
    n.axisC = Object.assign(axisDefaults(), o.axisC || {});
    n.axisR = Object.assign(axisDefaults(), o.axisR || {});
    if (n.kind === "value") { n.cols = 1; n.rows = 1; }
    if (n.kind === "curve" || n.kind === "axis" || n.kind === "block") n.rows = n.rows || 1;
    if (n.kind !== "map") { n.rows = Math.max(1, n.kind === "block" ? n.rows : 1); }
    if (n.layout === "bosch" && !n.header) n.header = defaultHeader(n.kind);
    if (n.kind === "axis") {
      // у оси точки -- это и есть её значения
      n.axisC.mode = "none"; n.axisR.mode = "none";
    }
    return n;
  }

  // Геометрия: где что лежит. Возвращает части в порядке памяти.
  //   {start, dataAddr, end, parts: [{what, addr, n, cell}]}
  // what: nR nC (счётчики), aR aC (оси внутри записи), data, str
  function geometry(o) {
    o = o.axisC ? o : normalize(o);
    const parts = [];
    let a = o.addr;
    if (o.kind === "string") {
      const len = Math.max(1, o.length || 1);
      parts.push({ what: "str", addr: a, n: len, cell: "u8", size: len });
      return { start: o.addr, dataAddr: o.addr, end: o.addr + len, parts };
    }
    if (o.layout === "bosch") {
      for (const h of o.header || defaultHeader(o.kind)) {
        if (h === "nR" || h === "nC") {
          if (h === "nR" && o.kind !== "map") continue;
          parts.push({ what: h, addr: a, n: 1, cell: o.countSize === 2 ? "u16" : "u8", size: o.countSize });
          a += o.countSize;
        } else if (h === "aR" || h === "aC") {
          const ax = h === "aR" ? o.axisR : o.axisC;
          const n = h === "aR" ? o.rows : o.cols;
          if (h === "aR" && o.kind !== "map") continue;
          if (o.kind === "axis") continue;   // у оси точки -- это данные
          if (ax.mode !== "inline") continue;
          const sz = cellOf(ax.cell).size * n;
          parts.push({ what: h, addr: a, n, cell: ax.cell, size: sz });
          a += sz;
        }
      }
    }
    const n = o.cols * o.rows;
    const sz = cellOf(o.cell).size * n;
    const dataAddr = a;
    parts.push({ what: "data", addr: a, n, cell: o.cell, size: sz });
    a += sz;
    return { start: o.addr, dataAddr, end: a, parts };
  }

  // Прочитать объект из образа. toOff(addr) -> смещение в файле.
  function readObject(o, data, toOff, resolveAxis) {
    const g = geometry(o);
    const res = { geom: g, values: [], axisC: null, axisR: null, counts: {} };
    for (const p of g.parts) {
      const off = toOff(p.addr);
      const vals = [];
      const sz = cellOf(p.cell).size;
      for (let i = 0; i < p.n && p.what !== "str"; i++) vals.push(readCell(data, off + i * sz, p.cell, o.be));
      if (p.what === "nR" || p.what === "nC") res.counts[p.what] = vals[0];
      else if (p.what === "aR") res.axisR = scaleAll(vals, o.axisR);
      else if (p.what === "aC") res.axisC = scaleAll(vals, o.axisC);

<script>
// ---- formats.js
// Форматы маппаков: чтение и запись DAMOS (.dam, формат ASAP2DAM от Bosch)
// и A2L (ASAP2). Оба приводятся к общей модели из model.js -- в ней же
// живёт и ваш маппак, поэтому он пишется обратно в те же форматы.
//
// Разбор DAMOS -- тот же, что в tools/damos.py репозитория Ivanbl4, где он
// проверен на px5ns03d.dam и его образе. Оттуда же два установленных факта:
//   * в DAMOS ось X -- это СТРОКИ (медленный индекс), Y -- столбцы;
//   * в заголовке карты сначала счётчик строк, потом столбцов, затем ось

(function (root) {

  // ---------------------------------------------------------------- DAMOS

  const SPZ = /^(\d+),\s*\/SPZ,\s*([^,]+),\s*\{(.*?)\},\s*(\d+),\s*\$([0-9A-Fa-f]+),\s*\$([0-9A-Fa-f]+)/;

  function fields(line) {
    const i = line.indexOf(",");

  }

  function parseDamos(text) {
    const vars = [], convs = new Map(), segments = [], header = {};

      line = line.trim();
      if (!line) continue;

        const p = line.slice(5).trim().replace(/;$/, "").split(/\s+/);
        if (p.length >= 3 && p[1][0] === "$" && p[2][0] === "$") {
          segments.push({ name: p[0], start: parseInt(p[1].slice(1), 16), end: parseInt(p[2].slice(1), 16) });
        }
        continue;
      }
      if (/^\/(EPK|SGB|EPR|UP|PNR),/.test(line)) {
        header[line.slice(1, line.indexOf(","))] = line.slice(line.indexOf(",") + 1).trim();
        continue;
      }
      let m = SPZ.exec(line);
      if (m) {
        v = {
          idx: int(m[1]), name: m[2].trim(), desc: m[3].trim(), typ: int(m[4]),
          addr: parseInt(m[5], 16), addr2: parseInt(m[6], 16),
          cw: 0, wmin: 0, wmax: 0, cx: 0, xref: 0, cy: 0, yref: 0, nx: 0, ny: 0,
        };
        vars.push(v); c = null;
        continue;
      }
      m = REG.exec(line);
      if (m) {
        c = { idx: int(m[1]), name: m[2].trim(), unit: m[6].trim(), pmin: num(m[9]), pmax: num(m[10]),
              rawMax: 0, off: 0, span: 0 };
        convs.set(c.idx, c); v = null;
        continue;
      }
      if (line.startsWith("/REP,") && c) {
        const p = fields(line);
        c.rawMax = int(p[0]); c.off = num(p[1]); c.span = num(p[3]);
        continue;
      }
      if (!v) continue;
      const p = fields(line);
      if (line.startsWith("/SPW,")) { v.cw = int(p[0]); v.wmin = num(p[2]); v.wmax = num(p[3]); }
      else if (line.startsWith("/SPX,")) { v.cx = int(p[0]); v.xmin = num(p[2]); v.xmax = num(p[3]); v.xref = int(p[4]); }
      else if (line.startsWith("/SPY,")) { v.cy = int(p[0]); v.ymin = num(p[2]); v.ymax = num(p[3]); v.yref = int(p[4]); }
      else if (line.startsWith("/FKX,")) v.nx = int(p[0]);
      else if (line.startsWith("/FKY,")) v.ny = int(p[0]);
      else if (line.startsWith("/ABL,")) v = null;
    }
    return { vars, convs, segments, header };
  }

  function convScale(c) {
    if (!c || !c.rawMax) return { factor: 1, offset: 0, unit: c ? c.unit : "" };
    return { factor: c.span / c.rawMax, offset: -c.off / c.rawMax, unit: c.unit };
  }

  // Ширина и знак величины. Надёжный источник -- метка в имени пересчёта
  // (ub, uw, sb, sw, ul, sl). "_@_SL" -- не метка ширины, а пометка оси.
  function damosCell(c, pmin, pmax) {
    if (c) {
      const nm = c.name.replace(/_@_SL$/i, "");
      const m = /(?:^|_)(ub|uw|sb|sw|ul|sl)(?:_|$)/i.exec(nm);
      if (m) {
        const t = m[1].toLowerCase();
        return (t[0] === "s" ? "s" : "u") + { b: "8", w: "16", l: "32" }[t[1]];
      }
    }
    // без метки -- по диапазону сырых значений
    const sc = convScale(c);
    const f = sc.factor || 1;
    const lo = ((pmin || 0) - sc.offset) / f, hi = ((pmax || 0) - sc.offset) / f;

    if (span > (signed ? 127.5 : 255.5)) return signed ? "s16" : "u16";

  function damosToObjects(d) {
    const byIdx = new Map(d.vars.map(v => [v.idx, v]));
    const conv = id => d.convs.get(id);
    const out = [];
    const axisCell = v => damosCell(conv(v.cx), v.xmin, v.xmax);
    const axisFrom = (scaleConv, refVar) => {
      const sc = convScale(conv(scaleConv));
      if (refVar && refVar.typ === 6) {
        return { mode: "ref", ref: refVar.addr, refName: refVar.name, cell: axisCell(refVar),

      }
      return { mode: "none", factor: sc.factor, offset: sc.offset, unit: sc.unit };
    };
    for (const v of d.vars) {
      const sw = convScale(conv(v.cw));
      const base = {
        name: v.name, desc: v.desc, addr: v.addr, source: "DAMOS", typ: v.typ,
        factor: sw.factor, offset: sw.offset, unit: sw.unit,
        cell: damosCell(conv(v.cw), v.wmin, v.wmax),
      };
      let o = null;
      switch (v.typ) {
        case 1: o = Object.assign(base, { kind: "value" }); break;
        case 2: {
          const cx = axisCell(v), sx = convScale(conv(v.cx));
          o = Object.assign(base, {
            kind: "curve", layout: "bosch", header: ["nC", "aC"], cols: v.nx,
            countSize: M().cellOf(cx).size === 2 ? 2 : 1,
            axisC: { mode: "inline", cell: cx, factor: sx.factor, offset: sx.offset, unit: sx.unit },
          });
          break;
        }
        case 3: {
          const cx = axisCell(v), cy = damosCell(conv(v.cy), v.ymin, v.ymax);
          const sx = convScale(conv(v.cx)), sy = convScale(conv(v.cy));
          const both16 = M().cellOf(cx).size === 2 && M().cellOf(cy).size === 2;
          o = Object.assign(base, {
            kind: "map", layout: "bosch", header: ["nR", "nC", "aR", "aC"],
            rows: v.nx, cols: v.ny, countSize: both16 ? 2 : 1,
            axisR: { mode: "inline", cell: cx, factor: sx.factor, offset: sx.offset, unit: sx.unit },
            axisC: { mode: "inline", cell: cy, factor: sy.factor, offset: sy.offset, unit: sy.unit },
          });
          break;
        }
        case 4: case 7: {
          const ax = byIdx.get(v.xref);
          o = Object.assign(base, {
            kind: "curve", layout: "plain",
            cols: v.nx || (ax && ax.typ === 6 ? ax.nx : 0),
            axisC: axisFrom(v.cx, ax),
          });
          break;
        }
        case 5: case 8: {
          const ax = byIdx.get(v.xref), ay = byIdx.get(v.yref);
          o = Object.assign(base, {
            kind: "map", layout: "plain",
            rows: v.nx || (ax && ax.typ === 6 ? ax.nx : 0),
            cols: v.ny || (ay && ay.typ === 6 ? ay.nx : 0),
            axisR: axisFrom(v.cx, ax), axisC: axisFrom(v.cy, ay),
          });
          break;
        }
        case 6: {
          const cx = axisCell(v), sx = convScale(conv(v.cx));
          o = Object.assign(base, {
            kind: "axis", layout: "bosch", header: ["nC", "aC"], cols: v.nx, cell: cx,
            countSize: M().cellOf(cx).size === 2 ? 2 : 1,
            factor: sx.factor, offset: sx.offset, unit: sx.unit,
          });
          break;
        }
        case 12: o = Object.assign(base, { kind: "string", length: v.addr2 > v.addr ? v.addr2 - v.addr + 1 : 0 }); break;
        case 13: o = Object.assign(base, { kind: "block", cols: v.nx || 1 }); break;
        default: o = Object.assign(base, { kind: "value", note: "тип DAMOS " + v.typ }); break;
      }
      if ((o.kind === "curve" || o.kind === "axis" || o.kind === "block") && !o.cols) o.cols = 1;
      if (o.kind === "map") { o.cols = o.cols || 1; o.rows = o.rows || 1; }

  }

  // ------------------------------------------------------------------ A2L

  function tokenizeA2l(src) {
    const toks = [];
    let i = 0;
    const n = src.length;
    while (i < n) {
      const ch = src[i];
      if (ch === " " || ch === "\t" || ch === "\r" || ch === "\n") { i++; continue; }
      if (ch === "/" && src[i + 1] === "*") { const j = src.indexOf("*/", i + 2); i = j < 0 ? n : j + 2; continue; }
      if (ch === "/" && src[i + 1] === "/") { const j = src.indexOf("\n", i); i = j < 0 ? n : j + 1; continue; }
      if (ch === '"') {
        let s = "", j = i + 1;
        while (j < n) {
          if (src[j] === "\\" && j + 1 < n) { s += src[j + 1]; j += 2; continue; }
          if (src[j] === '"') {

          s += src[j++];

      toks.push({ s: false, v: src.slice(i, j) });

  function parseA2lTree(src) {

      const t = toks[i];
      if (!t.s && t.v === "/begin") {
        const b = { kind: (toks[++i] || {}).v || "?", args: [], children: [] };
        stack[stack.length - 1].children.push(b);
        stack.push(b);

  function kv(b, key, n) {

  const DTYPE = {

    FLOAT32_IEEE: "f32",

  function compu(b) {

    const co = kv(b, "COEFFS", 6);

  }

  function layout(b) {
    const rl = { name: argv(b)[0], fnc: "u8", colDir: false, pos: {}, dt: {} };
    const f = kv(b, "FNC_VALUES", 3);

    for (const k of ["AXIS_PTS_X", "AXIS_PTS_Y", "NO_AXIS_PTS_X", "NO_AXIS_PTS_Y"]) {
      const p = kv(b, k, 2);
      if (p) { rl.pos[k] = toInt(p[0]); rl.dt[k] = DTYPE[p[1]] || "u8"; }
    }
    return rl;
  }

  function parseA2l(text) {
    const tree = parseA2lTree(text);
    let proj = null;
    (function find(b) {
      for (const c of b.children) { if (c.kind === "PROJECT") { proj = c; return; } find(c); }
    })(tree);

    const mod = all(proj, "MODULE")[0];

    const cmOf = n => compus.get(n) || { factor: 1, offset: 0, unit: "" };
    const out = [];

    for (const b of all(mod, "AXIS_PTS")) {
      const a = argv(b);

      const rl = layouts.get(a[4]) || layout({ args: [], children: [] });
      const cm = cmOf(a[6]);
      const n = toInt(a[7]);

      const o = {
        name: a[0], desc: a[1] || "", addr: toInt(a[2]), kind: "axis", source: "A2L",
        cols: n, cell: rl.dt.AXIS_PTS_X || rl.fnc, factor: cm.factor, offset: cm.offset, unit: cm.unit,
        layout: hasCount ? "bosch" : "plain", header: ["nC", "aC"],
        countSize: hasCount ? M().cellOf(rl.dt.NO_AXIS_PTS_X).size : 1, be,
      };
      const bo = kv(b, "BYTE_ORDER", 1);

    }

    for (const b of all(mod, "CHARACTERISTIC")) {
      const a = argv(b);
      // Name, Long, Type, Address, Deposit, MaxDiff, Conversion, Lower, Upper
      const type = a[2] || "VALUE";
      const rl = layouts.get(a[4]) || layout({ args: [], children: [] });
      const cm = cmOf(a[6]);
      const o = {
        name: a[0], desc: a[1] || "", addr: toInt(a[3]), source: "A2L",
        cell: rl.fnc, factor: cm.factor, offset: cm.offset, unit: cm.unit, be,
      };
      const bo = kv(b, "BYTE_ORDER", 1);
      if (bo) o.be = /MSB_FIRST/.test(bo[0]);
      const descrs = all(b, "AXIS_DESCR").map(d => {
        const x = argv(d);
        const ref = kv(d, "AXIS_PTS_REF", 1);
        const dc = cmOf(x[2]);
        return { attr: x[0], n: toInt(x[3]), ref: ref ? ref[0] : null, cm: dc };
      });
      const num = kv(b, "NUMBER", 1);
      const md = kv(b, "MATRIX_DIM", 3);
      const inline = ("AXIS_PTS_X" in rl.pos) || ("NO_AXIS_PTS_X" in rl.pos);
      const axisOf = (d, dt) => {
        if (!d) return { mode: "none" };
        const base = { factor: d.cm.factor, offset: d.cm.offset, unit: d.cm.unit };
        if (d.ref && axisPts.has(d.ref)) {
          const ap = axisPts.get(d.ref);
          return Object.assign(base, { mode: "ref", ref: ap.addr, refName: ap.name, cell: ap.cell });
        }
        if (d.attr === "STD_AXIS" && dt) return Object.assign(base, { mode: "inline", cell: dt });
        return Object.assign(base, { mode: "none" });
      };
      if (type === "VALUE") o.kind = "value";
      else if (type === "ASCII") { o.kind = "string"; o.length = num ? toInt(num[0]) : (md ? toInt(md[0]) : 0); }
      else if (type === "VAL_BLK") {
        o.kind = "block";
        const dims = md ? md.map(toInt).filter(Boolean) : [];
        o.cols = num ? toInt(num[0]) : (dims[0] || 1);
        if (dims.length > 1) o.rows = dims[1];
      } else if (type === "CURVE") {
        o.kind = "curve"; o.cols = descrs[0] ? descrs[0].n : 1;
        o.axisC = axisOf(descrs[0], rl.dt.AXIS_PTS_X);
        if (inline) {
          o.layout = "bosch";
          o.header = headerOrder(rl, { X: "C" });
          o.countSize = M().cellOf(rl.dt.NO_AXIS_PTS_X || "u8").size;
        }
      } else if (type === "MAP") {
        o.kind = "map";
        const dx = descrs[0], dy = descrs[1];
        const nx = dx ? dx.n : 1, ny = dy ? dy.n : 1;
        const ax = axisOf(dx, rl.dt.AXIS_PTS_X), ay = axisOf(dy, rl.dt.AXIS_PTS_Y);
        // COLUMN_DIR: по памяти быстрее меняется Y; ROW_DIR -- X
        if (rl.colDir) { o.cols = ny; o.rows = nx; o.axisC = ay; o.axisR = ax; }
        else { o.cols = nx; o.rows = ny; o.axisC = ax; o.axisR = ay; }
        if (inline) {
          o.layout = "bosch";
          o.header = headerOrder(rl, rl.colDir ? { X: "R", Y: "C" } : { X: "C", Y: "R" });
          o.countSize = M().cellOf(rl.dt.NO_AXIS_PTS_X || "u8").size;
        }
      } else continue;    // CUBOID и прочее тренажёр не сравнивает
      out.push(M().normalize(o));
    }
    return { objects: out };
  }

  // Порядок элементов заголовка -- по номерам позиций в RECORD_LAYOUT
  function headerOrder(rl, map) {
    const items = [];
    for (const [k, tag] of [["NO_AXIS_PTS_X", "nX"], ["NO_AXIS_PTS_Y", "nY"],
                            ["AXIS_PTS_X", "aX"], ["AXIS_PTS_Y", "aY"]]) {
      if (k in rl.pos) items.push([rl.pos[k], tag]);
    }
    items.sort((a, b) => a[0] - b[0]);
    return items.map(([, t]) => t[0] + (map[t[1]] || "C"));
  }

  // ------------------------------------------------------------- привязка

  // Уточнить размеры по счётчикам в самом образе: в A2L число точек -- это
  // максимум (MaxAxisPoints), а настоящее записано в заголовке.
  function refineWithImage(objs, data, toOff) {
    let checked = 0, agree = 0;
    for (const o of objs) {
      if (o.layout !== "bosch") continue;
      const g = M().geometry(o);
      for (const p of g.parts) {
        if (p.what !== "nR" && p.what !== "nC") continue;
        const v = M().readCell(data, toOff(p.addr), p.cell, o.be);
        const want = p.what === "nR" ? o.rows : o.cols;
        checked++;
        if (v === want) { agree++; continue; }
        if (o.source === "A2L" && v > 0 && v <= want) {
          if (p.what === "nR") o.rows = v; else o.cols = v;
          agree++;
        }
      }
    }
    return { checked, agree };
  }

  // Подобрать базу образа: при какой базе больше объектов попадает в файл и
  // больше счётчиков в заголовках совпадает с DAMOS. Считаем, а не гадаем.
  function scoreBase(objs, data, base) {
    let inside = 0, hdrOk = 0, hdr = 0;
    const size = data.length;
    for (const o of objs) {
      const off = o.addr - base;
      if (off < 0 || off >= size) continue;
      inside++;
      if (o.layout === "bosch") {
        hdr++;
        const g = M().geometry(o);
        const p = g.parts[0];
        if (p.what === "nR" || p.what === "nC") {
          const v = M().readCell(data, off, p.cell, o.be);
          if (v === (p.what === "nR" ? o.rows : o.cols)) hdrOk++;
        }
      }
    }
    return { base, inside, hdr, hdrOk, score: inside + 4 * hdrOk };
  }

  function suggestBases(objs, data, extra) {
    const cands = new Set([0, 0x800000, 0x80000, 0xC00000, 0x400000, 0x10000, 0x80000000, 0xA0000000]);
    for (const e of extra || []) cands.add(e);
    // база по наименьшему адресу объектов, выровненная на 64 КБ
    if (objs.length) {
      const lo = Math.min(...objs.map(o => o.addr));
      cands.add(lo - (lo % 0x10000));
      cands.add(lo - (lo % 0x100000));
    }
    return Array.from(cands).filter(b => b >= 0).map(b => scoreBase(objs, data, b))
      .sort((a, b) => b.score - a.score || a.base - b.base);
  }

  function loadReference(text, fileName) {
    const isA2l = /\/begin\s+PROJECT/i.test(text) || /\.a2l$/i.test(fileName || "");
    if (isA2l) {
      const r = parseA2l(text);
      return { format: "A2L", objects: r.objects, segments: [], header: {} };
    }
    if (/\/SPZ,/.test(text)) {
      const d = parseDamos(text);
      return { format: "DAMOS", objects: damosToObjects(d), segments: d.segments, header: d.header };
    }
    throw new Error("не похоже ни на DAMOS (.dam), ни на A2L");
  }

  // --------------------------------------------------------------- запись
  //
  // objs -- объекты с адресами CPU. Возвращает {text, warnings}. Всё, что
  // формат выразить не может, попадает в warnings, а не теряется молча.

  const A2L_DT = { u8: "UBYTE", s8: "SBYTE", u16: "UWORD", s16: "SWORD", u32: "ULONG", s32: "SLONG", f32: "FLOAT32_IEEE" };
  const TAG = { u8: "ub", s8: "sb", u16: "uw", s16: "sw", u32: "ul", s32: "sl" };

  function rawRange(cell) {
    const c = M().cellOf(cell);
    if (c.float) return [-1e6, 1e6];
    const bits = 8 * c.size;
    return c.signed ? [-Math.pow(2, bits - 1), Math.pow(2, bits - 1) - 1] : [0, Math.pow(2, bits) - 1];
  }
  function physRange(cell, factor, offset) {
    const [a, b] = rawRange(cell).map(v => v * (factor === undefined ? 1 : factor) + (offset || 0));
    return [Math.min(a, b), Math.max(a, b)];
  }
  const fnum = v => (Number.isInteger(v) ? String(v) : String(Number(v.toPrecision(12))));
  const hexAddr = v => "0x" + (v >>> 0).toString(16).toUpperCase();

  // Имена: только буквы, цифры, "_" и уникальные
  function uniqueNames(objs) {
    const used = new Set(), out = new Map();
    for (const o of objs) {
      let n = String(o.name || "").replace(/[^A-Za-z0-9_.]/g, "_");
      if (!n || /^[0-9.]/.test(n)) n = (o.kind === "axis" ? "AX_" : "OBJ_") + (o.addr >>> 0).toString(16).toUpperCase() + (n ? "_" + n : "");
      let k = n, i = 2;
      while (used.has(k)) k = n + "_" + i++;
      used.add(k); out.set(o, k);
    }
    return out;
  }

  function writeA2l(objs, opts) {
    opts = opts || {};
    const warnings = [];
    const names = uniqueNames(objs);
    const axisAt = new Map(objs.filter(o => o.kind === "axis").map(o => [o.addr, o]));
    const layouts = new Map(), compus = new Map();
    const q = s => '"' + String(s || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';

    // физ = f*сырое - c, то есть int = (1*физ + c) / f
    function cmName(factor, offset, unit) {
      if (factor === 1 && !offset && !unit) return "NO_COMPU_METHOD";
      const key = fnum(factor) + "|" + fnum(offset || 0) + "|" + (unit || "");
      if (!compus.has(key)) {
        const name = "CM_" + (compus.size + 1);
        compus.set(key, { name, text: [
          "    /begin COMPU_METHOD " + name + ' "" RAT_FUNC "%.4" ' + q(unit),
          "      COEFFS 0 1 " + fnum(-(offset || 0)) + " 0 0 " + fnum(factor),
          "    /end COMPU_METHOD"].join("\n") });
      }
      return compus.get(key).name;
    }
    function rl(items) {
      const name = "RL_" + items.map(i => i[0].replace(/_PTS/, "").replace(/^NO_AXIS/, "N").replace(/^AXIS/, "A").replace("FNC_VALUES", "V") + "_" + i[1]).join("_");
      if (!layouts.has(name)) {
        const body = items.map((it, k) => {
          const [kind, dt] = it;
          if (kind === "FNC_VALUES") return "      FNC_VALUES " + (k + 1) + " " + dt + " COLUMN_DIR DIRECT";
          if (kind.startsWith("AXIS_PTS")) return "      " + kind + " " + (k + 1) + " " + dt + " INDEX_INCR DIRECT";
          return "      " + kind + " " + (k + 1) + " " + dt;
        });
        layouts.set(name, ["    /begin RECORD_LAYOUT " + name].concat(body, ["    /end RECORD_LAYOUT"]).join("\n"));
      }
      return name;
    }
    const dt = cell => A2L_DT[cell] || "UBYTE";
    const cntDt = o => (o.countSize === 2 ? "UWORD" : "UBYTE");

    function axisDescr(o, key, n) {
      const a = o[key];
      const [lo, hi] = physRange(a.cell || "u8", a.factor, a.offset);
      const c = cmName(a.factor === undefined ? 1 : a.factor, a.offset, a.unit);
      if (a.mode === "ref") {
        const ax = axisAt.get(a.ref);
        if (ax) return ["      /begin AXIS_DESCR COM_AXIS NO_INPUT_QUANTITY " + c + " " + n + " " + fnum(lo) + " " + fnum(hi),
                        "        AXIS_PTS_REF " + names.get(ax), "      /end AXIS_DESCR"];
        warnings.push(names.get(o) + ": ось по " + hexAddr(a.ref) + " не размечена — записана как FIX_AXIS");
      }
      if (a.mode === "inline" && o.layout === "bosch") {
        return ["      /begin AXIS_DESCR STD_AXIS NO_INPUT_QUANTITY " + c + " " + n + " " + fnum(lo) + " " + fnum(hi), "      /end AXIS_DESCR"];
      }
      return ["      /begin AXIS_DESCR FIX_AXIS NO_INPUT_QUANTITY " + c + " " + n + " " + fnum(lo) + " " + fnum(hi),
              "        FIX_AXIS_PAR_DIST 0 1 " + n, "      /end AXIS_DESCR"];
    }

    const chars = [], axes = [];
    for (const o0 of objs) {
      const o = M().normalize(o0);
      const name = names.get(o0);
      const be = o.be ? ["      BYTE_ORDER MSB_FIRST"] : [];
      if (o.kind === "axis") {
        const lay = o.layout === "bosch" ? rl([["NO_AXIS_PTS_X", cntDt(o)], ["AXIS_PTS_X", dt(o.cell)]]) : rl([["AXIS_PTS_X", dt(o.cell)]]);
        const [lo, hi] = physRange(o.cell, o.factor, o.offset);
        axes.push(["    /begin AXIS_PTS " + name + " " + q(o.desc) + " " + hexAddr(o.addr) + " NO_INPUT_QUANTITY " + lay + " 0 " +
          cmName(o.factor, o.offset, o.unit) + " " + o.cols + " " + fnum(lo) + " " + fnum(hi)].concat(be, ["    /end AXIS_PTS"]).join("\n"));
        continue;
      }
      const [lo, hi] = physRange(o.kind === "string" ? "u8" : o.cell, o.factor, o.offset);
      let type, lay, extra = [];
      const c = o.kind === "string" ? "NO_COMPU_METHOD" : cmName(o.factor, o.offset, o.unit);
      if (o.kind === "value") { type = "VALUE"; lay = rl([["FNC_VALUES", dt(o.cell)]]); }
      else if (o.kind === "string") { type = "ASCII"; lay = rl([["FNC_VALUES", "UBYTE"]]); extra.push("      NUMBER " + Math.max(1, o.length || 1)); }
      else if (o.kind === "block") {
        type = "VAL_BLK"; lay = rl([["FNC_VALUES", dt(o.cell)]]);
        extra.push(o.rows > 1 ? "      MATRIX_DIM " + o.cols + " " + o.rows + " 1" : "      NUMBER " + o.cols);
      } else if (o.kind === "curve") {
        type = "CURVE";
        if (o.layout === "bosch") {
          const items = [["NO_AXIS_PTS_X", cntDt(o)]];
          if (o.axisC.mode === "inline") items.push(["AXIS_PTS_X", dt(o.axisC.cell)]);
          items.push(["FNC_VALUES", dt(o.cell)]);
          lay = rl(items);
        } else lay = rl([["FNC_VALUES", dt(o.cell)]]);
        extra = extra.concat(axisDescr(o, "axisC", o.cols));
      } else if (o.kind === "map") {
        type = "MAP";
        if (o.layout === "bosch") {
          // X -- строки, Y -- столбцы, данные COLUMN_DIR (быстрее меняется Y)
          const tok = { nR: ["NO_AXIS_PTS_X", cntDt(o)], nC: ["NO_AXIS_PTS_Y", cntDt(o)],
                        aR: o.axisR.mode === "inline" ? ["AXIS_PTS_X", dt(o.axisR.cell)] : null,
                        aC: o.axisC.mode === "inline" ? ["AXIS_PTS_Y", dt(o.axisC.cell)] : null };
          lay = rl(o.header.map(h => tok[h]).filter(Boolean).concat([["FNC_VALUES", dt(o.cell)]]));
        } else lay = rl([["FNC_VALUES", dt(o.cell)]]);
        extra = extra.concat(axisDescr(o, "axisR", o.rows), axisDescr(o, "axisC", o.cols));
      } else continue;
      chars.push(["    /begin CHARACTERISTIC " + name + " " + q(o.desc) + " " + type + " " + hexAddr(o.addr) + " " + lay + " 0 " + c + " " + fnum(lo) + " " + fnum(hi)]
        .concat(be, extra, ["    /end CHARACTERISTIC"]).join("\n"));
    }
    const proj = String(opts.project || "ECU").replace(/[^A-Za-z0-9_]/g, "_") || "ECU";
    const text = [
      "/* Маппак: " + (opts.comment || "") + " */",
      "/* Создан ЭБУ hex-тренажёром, " + objs.length + " объектов */",
      "ASAP2_VERSION 1 61",
      "/begin PROJECT " + proj + ' ""',
      "  /begin MODULE " + proj + ' ""',
      '    /begin MOD_COMMON "" BYTE_ORDER MSB_LAST ALIGNMENT_BYTE 1 ALIGNMENT_WORD 1 ALIGNMENT_LONG 1 /end MOD_COMMON',
      Array.from(compus.values()).map(c => c.text).join("\n"),
      Array.from(layouts.values()).join("\n"),
      axes.join("\n"),
      chars.join("\n"),
      "  /end MODULE",
      "/end PROJECT", ""].filter(s => s !== "").join("\n");
    return { text, warnings };
  }

  function writeDamos(objs, opts) {
    opts = opts || {};
    const warnings = [];
    const names = uniqueNames(objs);
    const idx = new Map();
    objs.forEach((o, i) => idx.set(o, i + 1));
    const axisAt = new Map(objs.filter(o => o.kind === "axis").map(o => [o.addr, o]));
    const convs = new Map();
    function conv(cell, factor, offset, unit) {
      if (cell === "f32") cell = "u32";
      const key = cell + "|" + fnum(factor) + "|" + fnum(offset || 0) + "|" + (unit || "");
      if (!convs.has(key)) {
        const id = convs.size + 1;
        const [lo, hi] = physRange(cell, factor, offset);
        convs.set(key, { id, text: id + ", /REG, cv" + id + "_" + (TAG[cell] || "ub") + ", {}, 6, 0, {" + (unit || "") + "}, 4, 5, " + fnum(lo) + ", " + fnum(hi) +
          "\r\n/REP, 1, " + fnum(-(offset || 0)) + ", 0, " + fnum(factor) + ", 0, 0;" });
      }
      return convs.get(key).id;
    }
    const rng = (cell, f, o) => physRange(cell, f, o).map(num).join(", ");
    const vars = [];
    for (const o0 of objs) {
      const o = M().normalize(o0);
      const n = names.get(o0);
      if (o.be) warnings.push(n + ": в DAMOS нет big-endian — записан как little-endian");
      if (o.cell === "f32") warnings.push(n + ": в DAMOS нет float — записан как 32-битное целое");
      let typ, addr2 = o.addr, w = [0, "0, 0"], x = [0, "0, 0", 0], y = [0, "0, 0", 0], nx = 0, ny = 0;
      const W = () => [conv(o.cell, o.factor, o.offset, o.unit), rng(o.cell, o.factor, o.offset)];
      const AX = (a, ref) => [conv(ref ? ref.cell : (a.cell || "u8"), a.factor === undefined ? 1 : a.factor, a.offset, a.unit),
                              rng(ref ? ref.cell : (a.cell || "u8"), a.factor === undefined ? 1 : a.factor, a.offset), ref ? idx.get(ref) : 0];
      const refOf = a => {
        if (a.mode !== "ref") return null;
        const r = axisAt.get(a.ref);
        if (!r) warnings.push(n + ": ось по " + hexAddr(a.ref) + " не размечена — ссылка не записана");
        return r || null;
      };
      switch (o.kind) {
        case "value": typ = 1; w = W(); break;
        case "string": typ = 12; addr2 = o.addr + Math.max(1, o.length || 1) - 1; break;
        case "block":
          typ = 13; w = W(); nx = o.cols * Math.max(1, o.rows);
          if (o.rows > 1) warnings.push(n + ": двумерный блок записан одномерным (" + nx + ")");
          break;
        case "axis":
          typ = 6; x = AX({ cell: o.cell, factor: o.factor, offset: o.offset, unit: o.unit }, null); nx = o.cols;
          if (o.layout !== "bosch") warnings.push(n + ": ось без счётчика — в DAMOS ось всегда со счётчиком");
          else if (o.countSize !== M().cellOf(o.cell).size) warnings.push(n + ": ширина счётчика оси в DAMOS равна ширине точек");
          break;
        case "curve":
          w = W(); nx = o.cols;
          if (o.layout === "bosch" && o.axisC.mode === "inline") {
            typ = 2; x = AX(o.axisC, null);
            if (o.countSize !== M().cellOf(o.axisC.cell).size) warnings.push(n + ": ширина счётчика кривой в DAMOS равна ширине точек оси");
          } else {
            const r = refOf(o.axisC);
            typ = r ? 7 : 4; x = AX(o.axisC, r);
            if (o.layout === "bosch") warnings.push(n + ": заголовок без оси внутри DAMOS не выражает — записано без заголовка");
          }
          break;
        case "map":
          w = W(); nx = o.rows; ny = o.cols;
          if (o.layout === "bosch" && o.axisR.mode === "inline" && o.axisC.mode === "inline") {
            typ = 3; x = AX(o.axisR, null); y = AX(o.axisC, null);
            const both16 = M().cellOf(o.axisR.cell).size === 2 && M().cellOf(o.axisC.cell).size === 2;
            if (o.countSize !== (both16 ? 2 : 1)) warnings.push(n + ": в DAMOS счётчики карты словные, только если обе оси словные");
            if (o.header.join() !== "nR,nC,aR,aC") warnings.push(n + ": в DAMOS заголовок всегда «строки, столбцы» — порядок изменён");
          } else {
            const rr = refOf(o.axisR), rc = refOf(o.axisC);
            typ = (rr || rc) ? 8 : 5; x = AX(o.axisR, rr); y = AX(o.axisC, rc);
            if (o.layout === "bosch") warnings.push(n + ": заголовок без обеих осей внутри DAMOS не выражает — записано без заголовка");
          }
          break;
        default: continue;
      }
      const h = v => "$" + (v >>> 0).toString(16).toUpperCase();
      const desc = String(o.desc || "").replace(/[{}\r\n]/g, " ");
      vars.push([
        idx.get(o0) + ", /SPZ, " + n + ", {" + desc + "}, " + typ + ", " + h(o.addr) + ", " + h(addr2),
        "/SPW, " + w[0] + ", 0, " + w[1],
        "/SPX, " + x[0] + ", 0, " + x[1] + ", " + x[2],
        "/SPY, " + y[0] + ", 0, " + y[1] + ", " + y[2],
        "/FKX, " + nx + ", 0, 0",
        "/FKY, " + ny + ", 0, 0",
        "/ABL, 0;", ""].join("\r\n"));
    }
    const lines = [
      "*** Created by ECU hex trainer ***",
      "/EPR, {" + String(opts.project || "ECU").replace(/[{}]/g, "") + "}, {mappack}, DAMPAR_03",
      "/EPK, {" + String(opts.comment || "").replace(/[{}]/g, "") + "}",
      "/SPC, " + objs.length,
      "/UMR, " + convs.size,
    ];
    if (opts.size) lines.push("/SND, DATA1 $" + (opts.base >>> 0).toString(16).toUpperCase() + " $" + ((opts.base + opts.size - 1) >>> 0).toString(16).toUpperCase());
    lines.push(";", "");
    const text = lines.join("\r\n") + "\r\n" + vars.join("\r\n") + "\r\n" + Array.from(convs.values()).map(c => c.text).join("\r\n\r\n") + "\r\n";
    return { text, warnings };
  }

  // Текст в cp1251 -- так DAMOS пишут исторически
  function encodeCp1251(text) {
    const tbl = M().CP1251, rev = new Map();
    tbl.forEach((ch, i) => rev.set(ch, i));
    const out = new Uint8Array(text.length);
    let n = 0;
    for (const ch of text) out[n++] = rev.has(ch) ? rev.get(ch) : 0x3F;
    return out.slice(0, n);
  }

  ET.fmt = {
    parseDamos, damosToObjects, parseA2l, parseA2lTree, tokenizeA2l, loadReference,
    refineWithImage, suggestBases, scoreBase, damosCell, convScale,
    writeA2l, writeDamos, encodeCp1251, uniqueNames,
  };
})(typeof window !== "undefined" ? window : globalThis);

<script>
// ---- markup.js
// Ваш маппак: список калибровочных объектов (model.js).
//
// Внутри адреса хранятся как СМЕЩЕНИЯ В ФАЙЛЕ, а адрес CPU получается как
// база + смещение. Тогда смена базы не сдвигает разметку с байтов, а в
// файл маппака (A2L/DAMOS) пишутся уже адреса CPU.
(function (root) {
  "use strict";
  const ET = root.ET = root.ET || {};
  const M = () => ET.model;

  class Pack {
    constructor(size) {
      this.size = size;
      this.objects = [];
      this.version = 0;
      this._units = null;
    }

    touch() { this.version++; this._units = null; }

    // объекты, отсортированные по началу, с границами в файле
    units() {
      if (this._units) return this._units;
      this._units = this.objects.map(o => {
        const g = M().geometry(o);
        return { off: g.start, end: Math.max(g.end, g.start + 1), item: o, geom: g };
      }).sort((a, b) => a.off - b.off);
      return this._units;
    }

    unitAt(off) {
      const u = this.units();
      let lo = 0, hi = u.length - 1, best = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (u[mid].off <= off) { best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      for (let i = best; i >= 0 && i > best - 16; i--) {
        if (u[i].off <= off && off < u[i].end) return u[i];
      }
      return null;
    }

    overlapping(a, b) { return this.units().filter(u => u.off < b && u.end > a); }

    add(o) { this.objects.push(o); this.touch(); }
    remove(o) { this.objects = this.objects.filter(x => x !== o); this.touch(); }

    toJSON() { return this.objects.map(o => JSON.parse(JSON.stringify(o))); }

    static fromJSON(list, size) {
      const p = new Pack(size);
      p.objects = (list || []).map(o => M().normalize(o));
      p.touch();
      return p;
    }
  }

  // Копия объекта со сдвигом всех адресов (смещение <-> адрес CPU)
  function shift(o, delta) {
    const c = JSON.parse(JSON.stringify(o));
    c.addr += delta;
    for (const k of ["axisC", "axisR"]) if (c[k] && c[k].mode === "ref" && c[k].ref !== null && c[k].ref !== undefined) c[k].ref += delta;
    return M().normalize(c);
  }

  // Маппак в адресах CPU -- для сверки и записи в файл
  function cpuObjects(pack, base) { return pack.objects.map(o => Object.assign(shift(o, base), { _orig: o })); }

  ET.markup = { Pack, shift, cpuObjects };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
// ---- compare.js
// Сверка вашего маппака с эталоном (DAMOS или A2L).
//
// Пара ищется по адресу, а не по имени: имя вы вправе дать своё, а вот
// найти объект -- значит указать, где он лежит. Порядок поиска пары:
//   1. совпало начало записи;
//   2. совпало начало данных (вы разметили тело без заголовка или наоборот);
//   3. области пересекаются -- найдено, но с неверной границей.
// Каждый объект эталона идёт в пару не больше одного раза.
(function (root) {
  "use strict";
  const ET = root.ET = root.ET || {};
  const M = () => ET.model;

  const ONE_D = new Set(["curve", "axis", "block"]);

  function close(a, b) {
    if (a === b) return true;
    const d = Math.abs(a - b), s = Math.max(Math.abs(a), Math.abs(b));
    return d <= 1e-9 || d / s < 2e-4;
  }

  function scaleText(f, o) {
    return "×" + M().fmtNum(f, 6) + (o ? (o > 0 ? " +" : " ") + M().fmtNum(o, 6) : "");
  }

  function checkPair(u, r, how) {
    const checks = [];
    const gr = M().geometry(r);
    // 1. граница
    if (how === "addr") checks.push({ what: "Адрес", ok: true, user: hexs(u.addr), ref: hexs(r.addr) });
    else if (how === "data") {
      checks.push({
        what: "Адрес", ok: false, user: hexs(u.addr), ref: hexs(r.addr),
        note: gr.dataAddr !== r.addr
          ? "данные совпали, но запись начинается раньше — с заголовка (счётчики и оси)"
          : "данные совпали, но у вас перед ними учтён заголовок, которого нет",
      });
    } else {
      checks.push({
        what: "Адрес", ok: false, user: hexs(u.addr), ref: hexs(r.addr),
        note: "области пересекаются, сдвиг " + (u.addr - r.addr > 0 ? "+" : "") + (u.addr - r.addr) + " байт",
      });
    }
    // 2. вид
    const kindOk = u.kind === r.kind || (ONE_D.has(u.kind) && ONE_D.has(r.kind)) ||
      (u.kind === "block" && r.kind === "value" && u.cols === 1);
    checks.push({
      what: "Вид", ok: kindOk, user: M().KINDS[u.kind], ref: M().KINDS[r.kind],
      note: kindOk && u.kind !== r.kind ? "одномерные виды считаются равными" : "",
    });
    // 3. размер
    if (r.kind === "string") {
      if (r.length && u.kind === "string") {
        checks.push({ what: "Длина", ok: u.length >= r.length, user: u.length, ref: r.length });
      }
    } else if (r.kind !== "value") {
      const same = u.cols === r.cols && u.rows === r.rows;
      const tr = !same && u.cols === r.rows && u.rows === r.cols;
      checks.push({
        what: "Размер", ok: same, user: u.cols + "×" + u.rows, ref: r.cols + "×" + r.rows,
        note: tr ? "транспонировано: перепутаны строки и столбцы (быстрый индекс в памяти — столбцы)" : "",
      });
    }
    // 4. ячейка
    if (r.kind !== "string") {
      const cu = M().cellOf(u.cell), cr = M().cellOf(r.cell);
      const ok = u.cell === r.cell && !!u.be === !!r.be;
      let note = "";
      if (!ok && cu.size === cr.size) note = "ширина верна, ошибка в знаке или порядке байт";
      checks.push({ what: "Ячейка", ok, user: u.cell + (u.be ? " BE" : ""), ref: r.cell + (r.be ? " BE" : ""), note });
      // 5. пересчёт
      if (!close(r.factor, 1) || Math.abs(r.offset) > 1e-9 || !close(u.factor, 1) || Math.abs(u.offset) > 1e-9) {
        const ok2 = close(u.factor, r.factor) && (Math.abs(u.offset - r.offset) < 1e-6 * Math.max(1, Math.abs(r.offset)) + 1e-9);
        checks.push({
          what: "Пересчёт", ok: ok2, user: scaleText(u.factor, u.offset) + (u.unit ? " " + u.unit : ""),
          ref: scaleText(r.factor, r.offset) + (r.unit ? " " + r.unit : ""),
        });
      }
    }
    // 6. оси
    if (r.kind === "map" || r.kind === "curve") {
      for (const [k, title] of [["axisC", "Ось столбцов"], ["axisR", "Ось строк"]]) {
        if (k === "axisR" && r.kind !== "map") continue;
        const ra = r[k], ua = u[k];
        if (!ra || ra.mode === "none") continue;
        let ok = ua && ua.mode === ra.mode;
        let note = "";
        if (ok && ra.mode === "ref") {
          ok = ua.ref === ra.ref;
          if (!ok) note = "ссылка указывает не на ту ось";
        } else if (ok && ra.mode === "inline") {
          ok = ua.cell === ra.cell;
          if (!ok) note = "ширина точек оси другая";
        }
        checks.push({
          what: title, ok, user: axisText(ua), ref: axisText(ra) + (ra.refName ? " (" + ra.refName + ")" : ""), note,
        });
      }
    }
    const allOk = checks.every(c => c.ok);
    return { checks, status: allOk ? "ok" : "partial" };
  }

  function axisText(a) {
    if (!a || a.mode === "none") return "нет";
    if (a.mode === "inline") return "в записи, " + a.cell;
    return "по адресу " + hexs(a.ref);
  }

  function hexs(v) { return v === null || v === undefined ? "—" : M().hex(v, 6); }

  // opts: {kinds: Set|null, lo, hi, only: Set(ключей эталона)|null}
  function inScope(r, opts) {
    if (opts.kinds && !opts.kinds.has(r.kind)) return false;
    if (opts.lo !== undefined && opts.lo !== null && r.addr < opts.lo) return false;
    if (opts.hi !== undefined && opts.hi !== null && r.addr > opts.hi) return false;
    if (opts.only && !opts.only.has(refKey(r))) return false;
    return true;
  }

  function refKey(r) { return r.name + "@" + r.addr.toString(16); }

  function compare(userObjs, refObjs, opts) {
    opts = opts || {};
    const used = new Set();
    const pairs = [], extra = [];
    const byAddr = new Map(), byData = new Map();
    const geoms = new Map();
    for (const r of refObjs) {
      const g = M().geometry(r);
      geoms.set(r, g);
      if (!byAddr.has(r.addr)) byAddr.set(r.addr, []);
      byAddr.get(r.addr).push(r);
      if (!byData.has(g.dataAddr)) byData.set(g.dataAddr, []);
      byData.get(g.dataAddr).push(r);
    }
    const sorted = refObjs.slice().sort((a, b) => a.addr - b.addr);
    const pick = (list, u) => {
      if (!list) return null;
      const free = list.filter(r => !used.has(r));
      if (!free.length) return null;
      // предпочесть тот же вид
      return free.find(r => r.kind === u.kind) || free[0];
    };
    const pending = [];
    // проход 1: точное начало
    for (const u of userObjs) {
      const r = pick(byAddr.get(u.addr), u);
      if (r) { used.add(r); pairs.push(Object.assign({ u, r, how: "addr" }, checkPair(u, r, "addr"))); }
      else pending.push(u);
    }
    // проход 2: начало данных
    const pending2 = [];
    for (const u of pending) {
      const gu = M().geometry(u);
      const r = pick(byData.get(gu.dataAddr), u) || pick(byData.get(u.addr), u);
      if (r) { used.add(r); pairs.push(Object.assign({ u, r, how: "data" }, checkPair(u, r, "data"))); }
      else pending2.push(u);
    }
    // проход 3: пересечение областей
    for (const u of pending2) {
      const gu = M().geometry(u);
      let best = null, bestOv = 0;
      // двоичный поиск первого эталона, начинающегося до конца объекта
      let lo = 0, hi = sorted.length;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid].addr < gu.end) lo = mid + 1; else hi = mid; }
      for (let i = lo - 1; i >= 0 && i > lo - 400; i--) {
        const r = sorted[i];
        if (used.has(r)) continue;
        const gr = geoms.get(r);
        const ov = Math.min(gu.end, gr.end) - Math.max(gu.start, gr.start);
        if (ov <= 0) continue;
        const score = ov + (r.kind === u.kind ? 1e6 : 0) + (r.kind !== "value" ? 1e3 : 0);
        if (score > bestOv) { bestOv = score; best = r; }
      }
      if (best) { used.add(best); pairs.push(Object.assign({ u, r: best, how: "overlap" }, checkPair(u, best, "overlap"))); }
      else extra.push(u);
    }
    const scoped = refObjs.filter(r => inScope(r, opts));
    const scopedSet = new Set(scoped);
    const missing = scoped.filter(r => !used.has(r));
    // баллы: найти -- 40 %, остальные проверки делят 60 %
    let got = 0;
    for (const p of pairs) {
      if (!scopedSet.has(p.r)) continue;
      const rest = p.checks.filter(c => c.what !== "Адрес");
      const addrOk = p.how === "addr" ? 1 : 0.5;
      const part = rest.length ? rest.filter(c => c.ok).length / rest.length : 1;
      got += 0.4 * addrOk + 0.6 * part;
    }
    const total = scoped.length;
    return {
      pairs, extra, missing,
      inScopePairs: pairs.filter(p => scopedSet.has(p.r)),
      total, score: total ? got / total : 0,
      ok: pairs.filter(p => p.status === "ok" && scopedSet.has(p.r)).length,
      partial: pairs.filter(p => p.status !== "ok" && scopedSet.has(p.r)).length,
    };
  }

  ET.compare = { compare, checkPair, refKey, axisText };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
// ---- app.js
// ЭБУ hex-тренажёр: интерфейс.
//
// Hex-редактор только для чтения. Поверх байтов -- два слоя:
//   * ваш маппак (заливка): карты, кривые, оси, которые вы разметили сами
//     и сохраняете в A2L или DAMOS;
//   * эталон (подчёркивание): DAMOS или A2L, с которым идёт сверка. Для
//     тренировки его можно скрыть -- тогда он молчит до сверки.
// Адреса -- адреса CPU: база образа + смещение в файле, как Base Address
// в Ghidra и как адреса в DAMOS/A2L.
(function () {
  "use strict";
  const M = ET.model, F = ET.fmt, MK = ET.markup, CMP = ET.compare;
  const LINE_H = 18;

  // ------------------------------------------------------------ состояние
  const S = {
    fw: null,                 // {name, size, data, crc}
    base: 0,
    pack: null,               // ваш маппак (адреса -- смещения в файле)
    ref: null,                // {name, format, raw, objects (CPU), shift, pack (смещения)}
    hideRef: false,
    cur: 0, sel: null, anchor: null, top: 0,
    hist: [], fwd: [],
    showOff: false,
    side: "pack", packFilter: "", refFilter: "", refKind: "all",
    vw: { cols: 16, cell: "u8", be: false, fmt: "hex", mode: "text", org: 0 },
    rot: { az: -0.7, el: 0.6 },
    objFmt: "phys", objView: "table",
    checkOpts: { kinds: ["map", "curve"], lo: "", hi: "", reveal: false },
    lastCheck: null, lastSearch: null,
    undo: [], redo: [],
  };

  // ---------------------------------------------------------------- утилиты
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (k === "style" && typeof v === "object") Object.assign(e.style, v);
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "html") e.innerHTML = v;
      else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
    return e;
  }
  let toastT = 0;
  function toast(msg, ms) {
    const t = $("#toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(toastT);
    toastT = setTimeout(() => (t.style.display = "none"), ms || 2600);
  }
  function download(name, content, type) {
    const blob = new Blob([content], { type: type || "text/plain" });
    const a = el("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  // Архив .zip без сжатия: в опубликованной странице сохранять можно только
  // файлы из белого списка расширений, .a2l и .dam в него не входят
  function makeZip(name, bytes) {
    const nm = new TextEncoder().encode(name);
    const crc = parseInt(crc32(bytes), 16);
    const local = new DataView(new ArrayBuffer(30)), cen = new DataView(new ArrayBuffer(46)), end = new DataView(new ArrayBuffer(22));
    const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const head = (v, sig, off) => {
      v.setUint32(0, sig, true);
      let o = 4;
      if (sig === 0x02014b50) { v.setUint16(o, 20, true); o += 2; }
      v.setUint16(o, 20, true); v.setUint16(o + 2, 0x0800, true); v.setUint16(o + 4, 0, true);
      v.setUint16(o + 6, time, true); v.setUint16(o + 8, date, true);
      v.setUint32(o + 10, crc, true); v.setUint32(o + 14, bytes.length, true); v.setUint32(o + 18, bytes.length, true);
      v.setUint16(o + 22, nm.length, true);
      if (sig === 0x02014b50) v.setUint32(42, off, true);
    };
    head(local, 0x04034b50, 0);
    head(cen, 0x02014b50, 0);
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true);
    end.setUint32(12, 46 + nm.length, true); end.setUint32(16, 30 + nm.length + bytes.length, true);
    return new Blob([local, nm, bytes, cen, nm, end], { type: "application/zip" });
  }

  // Сохранить файл: в опубликованной странице -- через просмотрщик, в zip;
  // при локальном запуске -- обычным скачиванием
  async function saveFile(name, bytes) {
    const cl = window.claude && typeof window.claude.use === "function" ? window.claude : null;
    const dl = cl ? await cl.use("downloads") : null;
    if (!dl) { download(name, bytes, "application/octet-stream"); return true; }
    try {
      await dl.save({ filename: name + ".zip", data: makeZip(name, bytes) });
      toast("Сохранено: " + name + " (внутри " + name + ".zip)", 4000);
      return true;
    } catch (e) {
      toast(e && e.code === "declined" ? "Сохранение отменено" : "Не удалось сохранить: " + ((e && (e.message || e.code)) || e), 5000);
      return false;
    }
  }

  function pickFile(accept) {
    return new Promise(res => {
      const inp = $("#fileIn");
      inp.value = ""; inp.accept = accept || "";
      inp.onchange = () => res(inp.files[0] || null);
      inp.click();
    });
  }
  async function readText(file) {
    const buf = await file.arrayBuffer();
    try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder("windows-1251").decode(buf); }
  }
  const CRC_T = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(d) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < d.length; i++) c = CRC_T[(c ^ d[i]) & 0xFF] ^ (c >>> 8);
    return ((c ^ 0xFFFFFFFF) >>> 0).toString(16).toUpperCase().padStart(8, "0");
  }
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

  // ----------------------------------------------------------------- адреса
  const size = () => (S.fw ? S.fw.size : 0);
  const data = () => S.fw.data;
  const hexl = (v, n) => (v >>> 0).toString(16).padStart(n || 0, "0").toUpperCase();
  function addrW() { return Math.max(6, (S.base + Math.max(0, size() - 1)).toString(16).length); }
  const fa = off => hexl(S.base + off, addrW());
  const inImg = off => off >= 0 && off < size();
  const refVisible = () => S.ref && !S.hideRef;

  // "C84B78", "0xC84B78", "+1F0" (смещение в файле), имя объекта
  function parseAddr(str) {
    str = String(str || "").trim();
    if (!str) return null;
    if (/^\+/.test(str)) {
      const v = parseInt(str.slice(1).replace(/^0x/i, ""), 16);
      return isNaN(v) ? null : v;
    }
    if (S.pack) for (const o of S.pack.objects) if (o.name === str) return o.addr;
    if (refVisible()) for (const o of S.ref.objects) if (o.name === str) return o.addr - S.base;
    const h = str.replace(/^0x/i, "").replace(/h$/i, "");
    if (!/^[0-9a-f]+$/i.test(h)) return null;
    return parseInt(h, 16) - S.base;
  }

  // ------------------------------------------------------- объекты под байтом
  function partAt(u, off) {
    for (const p of u.geom.parts) if (off >= p.addr && off < p.addr + p.size) return p;
    return null;
  }
  const PART_CLASS = { data: "obj", aR: "axis", aC: "axis", nR: "cnt", nC: "cnt", str: "str" };
  function mineAt(off) { return S.pack ? S.pack.unitAt(off) : null; }
  function refAt(off) { return refVisible() && S.ref.pack ? S.ref.pack.unitAt(off) : null; }

  // Элемент объекта под байтом: какая часть, индекс, значение
  function elementAt(u, off) {
    const p = partAt(u, off);
    if (!p) return null;
    const o = u.item;
    if (p.what === "str") return { p, text: "строка" };
    const cs = M.cellOf(p.cell).size;
    const i = Math.floor((off - p.addr) / cs);
    const raw = M.readCell(data(), p.addr + i * cs, p.cell, o.be);
    const u8 = s => (s ? " " + s : "");
    if (p.what === "data") {
      const v = M.fmtNum(raw * o.factor + o.offset, 4) + u8(o.unit);
      if (o.kind === "map" || (o.kind === "block" && o.rows > 1)) return { p, text: "ячейка [" + Math.floor(i / o.cols) + "," + (i % o.cols) + "] = " + v };
      if (o.kind === "value") return { p, text: "значение = " + v };
      return { p, text: "точка [" + i + "] = " + v };
    }
    if (p.what === "aR" || p.what === "aC") {
      const ax = p.what === "aR" ? o.axisR : o.axisC;
      return { p, text: (p.what === "aR" ? "ось строк" : "ось столбцов") + " [" + i + "] = " + M.fmtNum(raw * ax.factor + ax.offset, 4) + u8(ax.unit) };
    }
    return { p, text: (p.what === "nR" ? "счётчик строк" : "счётчик столбцов") + " = " + raw };
  }

  // ------------------------------------------------------------------ вид
  //
  // Основной вид -- как текстовый режим WinOLS: N столбцов ячеек выбранного
  // формата (8/16/32 бит, LoHi/HiLo, hex/dec). Классический hex -- это 16
  // столбцов по байту. Ширину меняют клавиши M (больше) и W (меньше): когда
  // она равна ширине карты, карта встаёт ровной таблицей. В режиме 2D те же
  // байты рисуются графиком, вертикальные линии -- через каждые N ячеек, и у
  // карты они встают параллельно «скачкам».
  //
  // Строки можно выровнять по курсору (A): тогда строка начинается ровно с
  // карты, а не с адреса, кратного ширине.
  const cs = () => M.cellOf(S.vw.cell).size;
  const rowBytes = () => S.vw.cols * cs();
  const mod = (a, n) => ((a % n) + n) % n;
  const org = () => mod(S.vw.org, rowBytes());
  const rowBase = r => (org() ? org() - rowBytes() : 0) + r * rowBytes();
  const rowOf = off => Math.floor((off - rowBase(0)) / rowBytes());
  function visibleRows() { return Math.max(4, Math.floor($("#view").clientHeight / LINE_H)); }
  const totalRows = () => rowOf(Math.max(0, size() - 1)) + 1;
  const cellStart = off => off - mod(off - S.vw.org, cs());
  const MAX_COLS = 128;

  const CELL_OPTS = [["u8", "8 бит"], ["s8", "8 бит со знаком"], ["u16", "16 бит"], ["s16", "16 бит со знаком"],
    ["u32", "32 бит"], ["s32", "32 бит со знаком"], ["f32", "float"]];

  function cellWidth() {
    const c = M.cellOf(S.vw.cell);
    if (c.float) return 11;
    if (S.vw.fmt === "hex") return 2 * c.size;
    return { 1: 4, 2: 6, 4: 11 }[c.size];
  }
  function fmtCell(v) {
    if (!isFinite(v)) return "—";
    const c = M.cellOf(S.vw.cell);
    if (c.float) return M.fmtNum(v, 4);
    if (S.vw.fmt === "hex") return hexl(v < 0 ? v + Math.pow(2, 8 * c.size) : v, 2 * c.size);
    return String(v);
  }

  function setVw(ch) {
    Object.assign(S.vw, ch);
    S.vw.cols = Math.max(1, Math.min(MAX_COLS, S.vw.cols | 0));
    S.cur = cellStart(S.cur);
    S.sel = null; S.anchor = S.cur;
    S.top = Math.max(0, rowOf(S.cur) - 3);
    renderBar(); renderHex(); renderInsp(); renderBottom();
  }

  function renderBar() {
    const bar = $("#viewbar");
    bar.innerHTML = "";

      el("select", { title: "Порядок байт: LoHi — Intel (C166, TriCore), HiLo — Motorola", disabled: c.size === 1, onchange: e => setVw({ be: e.target.value === "hilo" }) },
        el("option", { value: "lohi", selected: !v.be }, "LoHi"), el("option", { value: "hilo", selected: v.be }, "HiLo")),

      el("button", { title: "Начинать строки с курсора (A) — карта встанет таблицей с первого столбца", onclick: alignRows }, "A ⇤ строки с курсора"));
    if (org()) bar.append(el("span", { class: "muted mono" }, "с " + fa(S.vw.org)),
      el("button", { title: "Строки — снова от начала файла", onclick: () => setVw({ org: 0 }) }, "×"));
  }
  function alignRows() { setVw({ org: S.cur }); }

  function renderHex() {
    if (!S.fw) { renderWelcome(); return; }
    S.top = Math.max(0, Math.min(S.top, totalRows() - 1));
    if (S.vw.mode === "2d") render2d(); else renderText();
    const n = visibleRows(), tr = $("#vscroll"), th = $("#vthumb");
    const H = tr.clientHeight, part = Math.min(1, n / Math.max(1, totalRows()));
    const tH = Math.max(18, H * part);
    th.style.height = tH + "px";
    th.style.top = (totalRows() > n ? (S.top / (totalRows() - n)) * (H - tH) : 0) + "px";
  }

  function selBounds() { return S.sel ? selRange() : [-1, -1]; }

  function renderText() {
    const view = $("#view");
    const n = visibleRows(), c = cs(), cols = S.vw.cols, rb = rowBytes();
    const [selA, selEnd] = selBounds();
    const d = data();
    const col = $("#hexcol");
    col.style.setProperty("--cw", cellWidth() + "ch");
    col.style.setProperty("--ca", S.vw.fmt === "hex" && !M.cellOf(S.vw.cell).float ? "center" : "right");
    const showText = rb <= 64;
    const group = cols > 8 && cols % 8 === 0;
    const aw = S.showOff ? Math.max(6, (size() - 1).toString(16).length) : addrW();
    let head = '<span class=a title="Щелчок — переключить адрес CPU / смещение в файле">' + (S.showOff ? "смещение" : "адрес") + "</span>";
    for (let i = 0; i < cols; i++) head += '<span class="y' + (group && i % 8 === 7 ? " g8" : "") + '">' + hexl(i * c, 2) + "</span>";
    $("#hexhead").innerHTML = head + (showText ? "  <span>текст (cp1251)</span>" : "");
    const out = [];
    const curCell = cellStart(S.cur);
    for (let r = S.top; r < Math.min(totalRows(), S.top + n); r++) {
      const base = rowBase(r);
      let h = "<span class=a>" + hexl(S.showOff ? Math.max(0, base) : S.base + Math.max(0, base), aw) + "</span>";
      for (let i = 0; i < cols; i++) {
        const o = base + i * c;
        const g = group && i % 8 === 7 ? " g8" : "";
        if (o < 0 || o + c > size()) { h += '<span class="y' + g + '"></span>'; continue; }
        const v = M.readCell(d, o, S.vw.cell, S.vw.be);
        let cls = "y" + g + (v === 0 ? " z" : "");
        const mu = mineAt(o);
        if (mu) { const p = partAt(mu, o); cls += " k-" + (p ? PART_CLASS[p.what] : "obj"); }
        const ru = refAt(o);
        if (ru) { const p = partAt(ru, o); const k = p ? PART_CLASS[p.what] : "obj"; cls += " r-" + (k === "obj" ? "data" : k); }
        if (o === curCell) cls += " cur";
        if (o >= selA && o < selEnd) cls += " sel";
        h += '<span class="' + cls + '" data-o="' + o + '">' + fmtCell(v) + "</span>";
      }
      let t = "";
      if (showText) {
        for (let i = 0; i < rb && base + i < size(); i++) {
          const o = base + i;
          if (o < 0) { t += " "; continue; }
          const b = d[o], pr = M.isPrintable(b);
          const cell = cellStart(o);
          t += '<span data-o="' + cell + '" class="' + (cell === curCell ? "cur " : "") + (pr ? "on" : "") + (o >= selA && o < selEnd ? " sel" : "") + '">' + (pr ? esc(M.CP1251[b]) : "·") + "</span>";
        }
      }
      out.push("<div class=hx>" + h + (showText ? "<span class=t>" + t + "</span>" : "") + "</div>");
    }
    view.innerHTML = out.join("");
  }

  // ---- 2D: значения графиком, линии через каждые N ячеек
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function fitCanvas(cv, w, h) {
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + "px"; cv.style.height = h + "px";
    const g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return g;
  }

  // start -- смещение первой ячейки, count -- сколько ячеек, grid -- ячеек в строке
  function drawStrip(cv, w, h, start, count, grid, opt) {
    const g = fitCanvas(cv, w, h);
    const c = cs(), d = data();
    const vals = [];
    for (let i = 0; i < count; i++) vals.push(M.readCell(d, start + i * c, S.vw.cell, S.vw.be));
    const fin = vals.filter(isFinite);
    const lo = fin.length ? Math.min(...fin) : 0, hi = fin.length ? Math.max(...fin) : 1;
    const L = 52, R = 8, T = 16, B = 18;
    const step = count > 1 ? (w - L - R) / (count - 1) : 0;
    const xOf = i => L + i * step;
    const yOf = v => T + (h - T - B) * (hi > lo ? 1 - (v - lo) / (hi - lo) : 0.5);
    g.fillStyle = cssVar("--bg"); g.fillRect(0, 0, w, h);
    // полосы: ваш маппак, выделение, эталон
    const band = (test, color, y0, y1) => {
      let i = 0;
      while (i < count) {
        if (!test(start + i * c)) { i++; continue; }
        let j = i;
        while (j + 1 < count && test(start + (j + 1) * c)) j++;
        g.fillStyle = color;
        g.fillRect(xOf(i) - step / 2, y0, Math.max(1, (j - i + 1) * step), y1 - y0);
        i = j + 1;
      }
    };
    band(o => !!mineAt(o), cssVar("--hex-obj"), T, h - B);
    if (opt.sel && S.sel) { const [a, b] = selRange(); band(o => o >= a && o < b, cssVar("--sel-bg"), T, h - B); }
    if (refVisible()) band(o => !!refAt(o), cssVar("--ref"), h - B, h - B + 4);
    // линии строк
    g.strokeStyle = cssVar("--line"); g.lineWidth = 1;
    g.fillStyle = cssVar("--muted"); g.font = "10px " + cssVar("--mono");
    const rowPx = grid * step;
    const labelEvery = Math.max(1, Math.ceil(70 / Math.max(1, rowPx)));
    // линии -- по границам строк основного вида (с учётом выравнивания)
    const i0 = mod((rowBase(0) - start) / c, grid);
    for (let k = 0, i = i0; i <= count; i += grid, k++) {
      const x = Math.round(xOf(i) - step / 2) + 0.5;
      g.beginPath(); g.moveTo(x, T); g.lineTo(x, h - B); g.stroke();
      if (opt.labels && k % labelEvery === 0 && i < count) g.fillText(hexl(S.base + start + i * c), x + 2, T - 4);
    }
    // значения
    g.strokeStyle = cssVar("--fg"); g.lineWidth = 1.2;
    g.beginPath();
    vals.forEach((v, i) => { const x = xOf(i), y = yOf(v); if (i) g.lineTo(x, y); else g.moveTo(x, y); });
    g.stroke();
    // курсор
    if (opt.cursor) {
      const i = (cellStart(S.cur) - start) / c;
      if (i >= 0 && i < count) {
        g.strokeStyle = cssVar("--accent"); g.lineWidth = 2;
        g.beginPath(); g.moveTo(xOf(i), T); g.lineTo(xOf(i), h - B); g.stroke();
      }
    }
    g.fillStyle = cssVar("--muted"); g.font = "11px " + cssVar("--ui");
    g.fillText(M.fmtNum(hi, 3), 4, T + 10); g.fillText(M.fmtNum(lo, 3), 4, h - B - 2);
    cv._map = { start, count, L, step };
  }

  function render2d() {
    const view = $("#view");
    const c = cs();
    const start = Math.max(0, rowBase(S.top));
    const count = Math.max(1, Math.min(visibleRows() * S.vw.cols, Math.floor((size() - start) / c)));
    $("#hexhead").innerHTML = '<span class=muted> 2D: ' + count + " ячеек с " + fa(start) + ", линии — через " + S.vw.cols + " (M/W)</span>";
    let cv = view.querySelector("canvas.v2d");
    if (!cv) { view.innerHTML = ""; cv = el("canvas", { class: "v2d" }); view.append(cv); }
    drawStrip(cv, view.clientWidth, view.clientHeight, start, count, S.vw.cols, { cursor: true, sel: true, labels: true });
  }

  // смещение ячейки под точкой графика
  function offAtCanvas(cv, x) {
    const m = cv._map;
    if (!m) return null;
    const i = Math.max(0, Math.min(m.count - 1, Math.round(m.step ? (x - m.L) / m.step : 0)));
    return m.start + i * cs();
  }

  // ------------------------------------------------------------ инспектор
  function renderInsp() {
    const box = $("#insp");
    if (!S.fw) { box.innerHTML = ""; return; }

    const rd = (cell, be) => M.readCell(d, o, cell, be);

      ["адрес", fa(o)], ["смещение", "+" + hexl(o)],

    }
