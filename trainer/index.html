<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭБУ hex-тренажёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Раскладка как у WinOLS: меню, панель инструментов, слева окно «Карты»,
   в центре вкладки (hex-дамп и открытые карты), справа значения под
   курсором, внизу строка состояния. */
:root {
  --bg: #ffffff; --chrome: #f0f0f0; --chrome2: #e3e3e3; --line: #cfcfcf; --line2: #a7a7a7;
  --fg: #1b1b1b; --muted: #6b6b6b; --accent: #0067c0; --accent-fg: #ffffff;
  --hover: #e5f1fb; --hover-line: #7eb4ea; --pick: #cce8ff; --pick-line: #99d1ff;
  --sel-bg: #b3d7ff; --zero: #b5b5b5;
  --obj: #b35a00; --axis: #9a6d00; --cnt: #7a6a4a; --str: #7b3fb0; --ref: #00838f;
  --hex-obj: #fde0c2; --hex-axis: #fbefc0; --hex-cnt: #ece2cc; --hex-str: #ece0f7;
  --ok: #1d7a3a; --warn: #b26b00; --bad: #b3261e;
  --heat-a: .42;
  --mono: "Consolas", "Cascadia Mono", "Courier New", ui-monospace, monospace;
  --ui: "Segoe UI", Tahoma, system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e1e; --chrome: #2b2b2d; --chrome2: #3a3a3d; --line: #45454a; --line2: #5c5c62;
    --fg: #e6e6e6; --muted: #9d9d9d; --accent: #3a96ff; --accent-fg: #0c1a2b;
    --hover: #2f3a46; --hover-line: #4f7fae; --pick: #264f78; --pick-line: #3a6ea5;
    --sel-bg: #264f78; --zero: #5d5d5d;
    --obj: #ffad5c; --axis: #e6c15a; --cnt: #c7b48c; --str: #c69cf0; --ref: #5cc9d3;
    --hex-obj: #4a321a; --hex-axis: #423818; --hex-cnt: #36302a; --hex-str: #33264a;
    --ok: #63c27f; --warn: #e3a64a; --bad: #ef7a72;
    --heat-a: .32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1e1e; --chrome: #2b2b2d; --chrome2: #3a3a3d; --line: #45454a; --line2: #5c5c62;
  --fg: #e6e6e6; --muted: #9d9d9d; --accent: #3a96ff; --accent-fg: #0c1a2b;
  --hover: #2f3a46; --hover-line: #4f7fae; --pick: #264f78; --pick-line: #3a6ea5;
  --sel-bg: #264f78; --zero: #5d5d5d;
  --obj: #ffad5c; --axis: #e6c15a; --cnt: #c7b48c; --str: #c69cf0; --ref: #5cc9d3;
  --hex-obj: #4a321a; --hex-axis: #423818; --hex-cnt: #36302a; --hex-str: #33264a;
  --ok: #63c27f; --warn: #e3a64a; --bad: #ef7a72;
  --heat-a: .32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--chrome); color: var(--fg); font: 12px/1.35 var(--ui); display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 2px; padding: 2px 5px; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
button { background: var(--chrome); border: 1px solid var(--line2); border-radius: 2px; padding: 2px 9px; cursor: default; }
button:hover { background: var(--hover); border-color: var(--hover-line); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible { outline: 1px dotted var(--fg); outline-offset: -4px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }

/* меню */
#menubar { display: flex; gap: 0; padding: 1px 2px; background: var(--chrome); border-bottom: 1px solid var(--line); user-select: none; position: relative; z-index: 60; }
#menubar > .mi { padding: 3px 9px; border: 1px solid transparent; }
#menubar > .mi:hover, #menubar > .mi.open { background: var(--hover); border-color: var(--hover-line); }
.drop { position: absolute; top: 100%; min-width: 300px; background: var(--bg); border: 1px solid var(--line2); box-shadow: 2px 3px 8px rgba(0,0,0,.25); padding: 2px; z-index: 70; }
.drop .it { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; padding: 3px 10px 3px 4px; white-space: nowrap; }
.drop .it:hover { background: var(--hover); }
.drop .it.dis { color: var(--muted); }
.drop .it.dis:hover { background: none; }
.drop .it .k { color: var(--muted); padding-left: 24px; }
.drop hr { border: 0; border-top: 1px solid var(--line); margin: 3px 2px; }

/* панель инструментов */
#toolbar { display: flex; align-items: center; gap: 3px; padding: 3px 4px; background: var(--chrome); border-bottom: 1px solid var(--line); flex-wrap: wrap; user-select: none; }
#toolbar .grp { display: flex; align-items: center; gap: 2px; padding-right: 6px; margin-right: 3px; border-right: 1px solid var(--line); }
#toolbar .grp:last-child { border-right: 0; }
#toolbar button { background: transparent; border-color: transparent; padding: 2px 7px; }
#toolbar button:hover { background: var(--hover); border-color: var(--hover-line); }
#toolbar button.on { background: var(--pick); border-color: var(--pick-line); }
#toolbar input[type=number] { width: 50px; padding: 1px 3px; }
#toolbar .lab { color: var(--muted); padding: 0 3px; }

/* рабочая область */
#work { flex: 1; display: flex; min-height: 0; }
.dock { display: flex; flex-direction: column; background: var(--chrome); min-width: 0; }
.dockhead { padding: 3px 7px; background: var(--chrome2); border-bottom: 1px solid var(--line); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.dockhead .sp { flex: 1; }
.dockhead button { padding: 0 6px; background: transparent; border-color: transparent; }
#dock { width: 330px; border-right: 1px solid var(--line); }
#docktools { display: flex; gap: 4px; padding: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#docktools input[type=search], #docktools input:not([type]) { flex: 1; min-width: 120px; }
#dockbody { flex: 1; overflow: auto; background: var(--bg); }
.docktabs { display: flex; gap: 0; padding: 0 4px 3px; border-top: 1px solid var(--line); background: var(--chrome); }
.docktabs button { border-top: 0; border-radius: 0 0 3px 3px; margin-right: -1px; background: var(--chrome2); padding: 2px 10px; }
.docktabs button.on { background: var(--bg); position: relative; top: -1px; border-top: 1px solid var(--bg); font-weight: 600; }
#splitL { width: 4px; cursor: col-resize; background: var(--chrome); }
#center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#tabs { display: flex; gap: 0; padding: 3px 4px 0; background: var(--chrome); border-bottom: 1px solid var(--line2); overflow-x: auto; user-select: none; }
#tabs .tab { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line); border-bottom: 0; margin-right: -1px; background: var(--chrome2); border-radius: 3px 3px 0 0; white-space: nowrap; max-width: 240px; }
#tabs .tab .t { overflow: hidden; text-overflow: ellipsis; }
#tabs .tab.on { background: var(--bg); border-color: var(--line2); position: relative; top: 1px; font-weight: 600; }
#tabs .tab .x { border: 0; background: transparent; padding: 0 3px; line-height: 1; color: var(--muted); }
#tabs .tab .x:hover { color: var(--fg); background: var(--hover); }
#tabs .tab .kind { font-size: 10px; color: var(--muted); font-weight: 400; }
#pane { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
#hexpane, #mappane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#hexrow { flex: 1; display: flex; min-height: 0; }
#hexcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#view { flex: 1; overflow-x: auto; overflow-y: hidden; font: 13px/18px var(--mono); white-space: pre; outline: none; cursor: default; user-select: none; background: var(--bg); }
#view canvas.v2d { display: block; cursor: crosshair; }
#vscroll { width: 16px; border-left: 1px solid var(--line); position: relative; background: var(--chrome); }
#vthumb { position: absolute; left: 3px; right: 3px; background: var(--line2); border-radius: 2px; min-height: 18px; }
#vthumb:hover { background: var(--muted); }
#insp { width: 236px; border-left: 1px solid var(--line); }
#inspbody { flex: 1; overflow: auto; padding: 4px 7px; background: var(--bg); }
#status { display: flex; gap: 0; background: var(--chrome); border-top: 1px solid var(--line2); font-size: 12px; user-select: none; overflow: hidden; }
#status > span { padding: 2px 9px; border-right: 1px solid var(--line); white-space: nowrap; }
#status > span.sp { flex: 1; border-right: 0; }
#status > span.clk:hover { background: var(--hover); }
#status b { font-weight: 600; font-family: var(--mono); }

/* hex */
#hexhead { font: 13px/18px var(--mono); white-space: pre; padding-left: 6px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--chrome); user-select: none; overflow: hidden; }
.hx, #hexhead { padding-left: 6px; }
.hx { height: 18px; }
.hx .a, #hexhead .a { color: var(--muted); display: inline-block; width: 10ch; }
#hexhead .a { cursor: pointer; }
.hx span.y, #hexhead span.y { display: inline-block; width: calc(var(--cw, 2ch) + 1ch); text-align: var(--ca, center); padding-right: .3ch; }
.hx span.y.g8, #hexhead span.y.g8 { margin-right: 1ch; }
.hx span.y.z { color: var(--zero); }
.hx .t { margin-left: 2ch; color: var(--muted); }
.hx .t span.on { color: var(--fg); }
.k-obj { background: var(--hex-obj); } .k-axis { background: var(--hex-axis); }
.k-cnt { background: var(--hex-cnt); } .k-str { background: var(--hex-str); }
.r-data { box-shadow: inset 0 -2px 0 var(--ref); } .r-axis { box-shadow: inset 0 -2px 0 var(--axis); }
.r-cnt { box-shadow: inset 0 -2px 0 var(--cnt); } .r-str { box-shadow: inset 0 -2px 0 var(--str); }
.hx span.y.df { color: var(--bad); font-weight: 700; }
.hx .cur { outline: 1px solid var(--fg); outline-offset: -1px; }
.hx .sel { background: var(--sel-bg) !important; }

/* окно карты */
#mapbar { display: flex; align-items: center; gap: 4px; padding: 3px 6px; background: var(--chrome); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#mapbar button.on { background: var(--pick); border-color: var(--pick-line); }
#mapbar .title { font-weight: 600; font-family: var(--mono); margin-left: 6px; }
#mapinfo { padding: 3px 8px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); }
#mapbody { flex: 1; overflow: auto; padding: 6px; background: var(--bg); }
table.map { border-collapse: collapse; font: 12px/1.35 var(--mono); }
table.map td, table.map th { padding: 1px 6px; text-align: right; border: 1px solid var(--line); white-space: nowrap; }
table.map th { background: var(--chrome2); font-weight: 600; }
table.map th.corner { color: var(--muted); font-weight: 400; font-family: var(--ui); }
table.map td.on { outline: 2px solid var(--fg); outline-offset: -2px; }
table.map td.chg { color: var(--bad); font-weight: 700; }
i.df { border-bottom: 2px solid var(--bad); }
canvas.plot { display: block; max-width: 100%; }

/* списки */
table.lst { border-collapse: collapse; width: 100%; font-size: 12px; table-layout: fixed; }
table.lst th { position: sticky; top: 0; background: var(--chrome2); font-weight: 400; text-align: left; padding: 2px 5px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line2); white-space: nowrap; overflow: hidden; }
table.lst th:hover { background: var(--hover); }
table.lst td { padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid transparent; }
table.lst td.m { font-family: var(--mono); }
table.lst tr:hover td { background: var(--hover); }
table.lst tr.on td { background: var(--pick); }
table.lst .ic { display: inline-block; width: 14px; text-align: center; color: var(--obj); }
table.lst tr.ref .ic { color: var(--ref); }
.pad { padding: 6px 8px; }
.sec { margin: 10px 0 4px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
.list { display: flex; flex-direction: column; }
.item { padding: 2px 6px; cursor: default; display: flex; gap: 8px; align-items: baseline; }
.item:hover { background: var(--hover); }
.item .addr { font-family: var(--mono); color: var(--muted); }
.item .nm { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .kd { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; border: 1px solid currentColor; font-weight: 400; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.score { font-size: 26px; font-weight: 700; }
table.chk { border-collapse: collapse; width: 100%; font-size: 12px; }
table.chk td { padding: 3px 5px; border-top: 1px solid var(--line); vertical-align: top; }
table.chk td.mono { font-family: var(--mono); }
.hint { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 10px 8px; }

/* значения под курсором */
#inspbody table { border-collapse: collapse; width: 100%; font: 12px/1.6 var(--mono); }
#inspbody td { padding: 0 3px; white-space: nowrap; }
#inspbody td:first-child { color: var(--muted); font-family: var(--ui); }
#inspbody h4 { margin: 8px 0 3px; font-size: 12px; }
.objbox { border-left: 3px solid var(--obj); padding: 3px 7px; margin: 4px 0; background: var(--chrome); }
.objbox.ref { border-left-color: var(--ref); }
.objbox b { font-family: var(--mono); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 10px; margin-right: 3px; vertical-align: -1px; }

/* диалоги */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; z-index: 100; align-items: flex-start; justify-content: center; padding-top: 6vh; }
#veil.on { display: flex; }
.dlg { background: var(--chrome); border: 1px solid var(--line2); box-shadow: 0 8px 30px rgba(0,0,0,.35); min-width: 380px; max-width: min(1100px, 96vw); max-height: 90vh; display: flex; flex-direction: column; }
.dlg h3 { margin: 0; padding: 6px 10px; font-size: 12px; font-weight: 600; background: var(--bg); border-bottom: 1px solid var(--line); }
.dlg .body { padding: 10px 12px; overflow: auto; }
.dlg .btns { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); }
.dlg .btns button { min-width: 80px; }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center; }
.form > label { color: var(--muted); }
fieldset { border: 1px solid var(--line); margin: 8px 0; padding: 6px 10px; }
legend { color: var(--muted); padding: 0 4px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--bg); }
table.keys td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
#toast { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 3px; display: none; z-index: 200; max-width: 80vw; }
#drop { position: fixed; inset: 0; border: 4px dashed var(--accent); display: none; z-index: 150; pointer-events: none; }
#welcome { padding: 28px; max-width: 760px; font: 13px/1.6 var(--ui); white-space: normal; user-select: text; }
#welcome h2 { margin-top: 0; font-size: 18px; }
#welcome li { margin: 4px 0; }

@media (max-width: 760px) {
  #work { flex-direction: column; }
  #dock { width: auto !important; height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #splitL, #insp { display: none; }
  .dlg { min-width: 0; width: 96vw; }
  .form { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="menubar"></div>
<div id="toolbar"></div>
<div id="work">
  <div id="dock" class="dock">
    <div class="dockhead"><span id="docktitle">Карты</span><span class="sp"></span><span id="dockcount" class="muted"></span></div>
    <div id="docktools"></div>
    <div id="dockbody"></div>
    <div class="docktabs" id="docktabs">
      <button data-tab="pack" class="on">Мой маппак</button>
      <button data-tab="ref">Эталон</button>
      <button data-tab="check">Сверка</button>
    </div>
  </div>
  <div id="splitL" title="Потяните, чтобы изменить ширину"></div>
  <div id="center">
    <div id="tabs"></div>
    <div id="pane">
      <div id="hexpane">
        <div id="hexrow">
          <div id="hexcol">
            <div id="hexhead"></div>
            <div id="view" tabindex="0"></div>
          </div>
          <div id="vscroll"><div id="vthumb"></div></div>
        </div>
      </div>
      <div id="mappane" hidden>
        <div id="mapbar"></div>
        <div id="mapinfo"></div>
        <div id="mapbody" tabindex="0"></div>
      </div>
    </div>
  </div>
  <div id="insp" class="dock">
    <div class="dockhead">Значения<span class="sp"></span><button id="inspClose" title="Скрыть (Вид → Панель значений)">×</button></div>
    <div id="inspbody"></div>
  </div>
</div>
<div id="status"></div>
<div id="veil"></div>
<div id="toast"></div>
<div id="drop"></div>
<input type="file" id="fileIn" hidden>

<script src="model.js"></script>
<script src="formats.js"></script>
<script src="markup.js"></script>
<script src="compare.js"></script>
<script src="app.js"></script>
</body>
</html>
